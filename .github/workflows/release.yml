name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Staged publishing through trusted publishing needs npm 11.15.0 or later.
      - run: npm install --global "npm@>=11.15.0 <12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check that the tag equals both package versions
        run: |
          for dir in packages/core packages/cli; do
            version="v$(node -p "require('./$dir/package.json').version")"
            [ "$version" = "$GITHUB_REF_NAME" ] || { echo "$dir is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      # pnpm pack writes the real version in place of workspace:*. npm stage publish does the OIDC upload.
      # A maintainer approves each staged version with 2FA before it goes live.
      - name: Stage core, then CLI
        run: |
          for dir in packages/core packages/cli; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already"
              continue
            fi
            tarball="$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
            npm stage publish "$tarball" --provenance --access public
          done
